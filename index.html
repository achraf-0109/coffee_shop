<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coffee Shop</title>
</head>
<body>
    <div class="nav-bar-container">
        <nav class="nav-bar">
            <div class="logo">
                <p>☕ Coffee</p>
            </div>
            <div class="headers">
                <p>Home</p>
                <p>About</p>
                <p>Menu</p>
                <p>Testimonials</p>
                <p>Gallery</p>
                <p>Contact</p>
            </div>
        </nav>
    </div>

    <div class="hero-section">
        <div class="cta-container">
            <h1>Best Coffee</p>
            <h1 class="cta">
                Make your day great with our
                special coffee!
            </h1>
            <p>
                Welcome to our coffee paradise,
                where every bean tells a story
                and every cup sparks joy
            </p>
            <div class="buttons">
                <button id="order-btn">
                    Order Now
                </button>
                <button id="contact-btn">
                    Contact Us
                </button>
            </div>
        </div>
        <img src="images/coffee-hero-section.png" 
                alt="Coffee"
                width="300" >
    </div>
    
    <script src="script.js"></script>
</body>
</html>
