    <link rel="stylesheet" href="style.css">
    <title>Coffee Shop</title>
</head>
<body>
    <header>
        <nav class="nav-bar section-content">
            <a href="#" class="nav-logo">

            <ul class="nav-menu">

                    <a href="#" class="nav-link">Home</a>

                <li class="nav-item">

                </li>
                <li class="nav-item">

    <div class="hero-section">

            <h1>Best Coffee</p>
